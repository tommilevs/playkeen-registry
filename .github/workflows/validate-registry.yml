name: Validate and refresh Playkeen registry
concurrency:
  group: playkeen-registry-refresh
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node -e "const j=JSON.parse(require('fs').readFileSync('registry/index.json')); if(j.schema!=='playkeen/registry-v1'||!Array.isArray(j.apps)) process.exit(1)"

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/build-registry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name playkeen-registry-bot
          git config user.email playkeen-registry-bot@users.noreply.github.com
          git add registry/index.json
          git diff --cached --quiet || git commit -m "chore: refresh application registry"
          git pull --rebase origin main
          git push origin HEAD:main
