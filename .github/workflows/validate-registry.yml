name: Validate and refresh Playkeen registry
concurrency:
  group: playkeen-registry-refresh
  cancel-in-progress: true
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node --test test/curated.test.mjs test/entware-feed.test.mjs
      - run: node -e "const j=JSON.parse(require('fs').readFileSync('registry/index.json')); if(j.schema!=='playkeen/registry-v1'||!Array.isArray(j.apps)||!Array.isArray(j.opkg_feeds)) process.exit(1)"
      - run: node -e "const fs=require('fs'),j=JSON.parse(fs.readFileSync('registry/index.json')); for(const f of j.opkg_feeds){const x=JSON.parse(fs.readFileSync('registry/entware/'+f.feed+'.json'));if(x.schema!=='playkeen/entware-feed-v1'||x.feed!==f.feed||x.packages.length!==f.count)throw Error('Invalid feed '+f.feed)}"

  refresh:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: node scripts/build-registry.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name playkeen-registry-bot
          git config user.email playkeen-registry-bot@users.noreply.github.com
          cp registry/index.json "$RUNNER_TEMP/index.json"
          git fetch origin main
          git reset --hard origin/main
          cp "$RUNNER_TEMP/index.json" registry/index.json
          git add registry/index.json registry/entware
          git diff --cached --quiet || git commit -m "chore: refresh application registry"
          git push origin HEAD:main
